backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://alphamedicalclinic.netlify.app
display_url: https://alphamedicalclinic.netlify.app
logo_url: https://alphamedicalclinic.netlify.app/images/logo-cropped.png

publish_mode: simple
locale: en

collections:
  - name: articles
    label: "📝 บทความ Journal"
    label_singular: "บทความ"
    files:
      - file: articles.json
        label: "รายการบทความทั้งหมด"
        name: list
        fields:
          - label: "บทความ"
            name: items
            widget: list
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "หัวข้อบทความ", name: title, widget: string }
              - { label: "Slug (URL ของบทความ)", name: slug, widget: string, hint: "URL ของบทความ — ภาษาอังกฤษตัวเล็ก ใช้ขีดคั่น เช่น 'thread-lift-guide' จะได้ URL = /article.html?slug=thread-lift-guide", pattern: ["^[a-z0-9-]+$", "ใช้ตัวอักษร a-z, ตัวเลข, และ - เท่านั้น"] }
              - label: "หมวด"
                name: category
                widget: select
                options:
                  - "Anti-Aging"
                  - "Aesthetic"
                  - "Dermatology"
                  - "Treatment"
                  - "Skincare"
                  - "Wellness"
                  - "News"
                default: "Treatment"
              - { label: "เวลาอ่าน", name: read_time, widget: string, default: "5 min read" }
              - { label: "วันที่เผยแพร่", name: date, widget: datetime, required: false }
              - { label: "รูปภาพประกอบ", name: image, widget: image, required: false, hint: "ถ้าไม่ใส่ จะใช้ตัวอักษรเป็น placeholder" }
              - { label: "ตัวอักษร placeholder", name: letter, widget: string, default: "A", required: false, hint: "ใช้เมื่อไม่มีรูปภาพ — ตัวอักษรเดียว เช่น A / B / G" }
              - { label: "ข้อความย่อ (แสดงบนการ์ด)", name: excerpt, widget: text }
              - { label: "เนื้อหาเต็ม (สำหรับอนาคต)", name: body, widget: markdown, required: false }

  - name: hero_slides
    label: "🖼️ รูปสไลด์โชว์ Hero"
    files:
      - file: _data/hero_slides.json
        label: "รายการรูปสไลด์โชว์"
        name: slides_list
        fields:
          - label: "รูปสไลด์"
            name: items
            widget: list
            summary: "{{fields.image}}"
            collapsed: true
            min: 1
            fields:
              - { label: "รูป", name: image, widget: image, hint: "อัพโหลดรูป (แนะนำขนาด >1600px กว้าง) หรือเลือกจาก library" }
              - { label: "คำอธิบายรูป (alt text)", name: alt, widget: string, required: false, default: "" }

  - name: hero
    label: "🏠 หน้าแรก (Hero)"
    files:
      - file: _data/hero.json
        label: "ข้อความหน้าแรก"
        name: hero_content
        fields:
          - { label: "ป้ายเล็กบน (Eyebrow)", name: eyebrow, widget: string, default: "Bangkok · Est. Premium Aesthetic Care" }
          - { label: "หัวข้อใหญ่ บรรทัด 1", name: headline_line1, widget: string, default: "Inspiring" }
          - { label: "หัวข้อใหญ่ บรรทัด 2 (italic ทอง)", name: headline_line2, widget: string, default: "Confidence" }
          - { label: "ข้อความใต้หัวข้อ", name: lead, widget: text, default: "สร้างความงามอย่างสมดุลจากภายในสู่ภายนอก\nด้วยนวัตกรรมการรักษาทันสมัย มาตรฐานสากล และความใส่ใจระดับพรีเมียม" }
          - { label: "ปุ่มหลัก — ข้อความ", name: cta_primary_text, widget: string, default: "Book via LINE" }
          - { label: "ปุ่มหลัก — ลิงก์", name: cta_primary_url, widget: string, default: "https://lin.ee/1i7Qgpv" }
          - { label: "ปุ่มรอง — ข้อความ", name: cta_secondary_text, widget: string, default: "Explore Treatments →" }

  - name: about
    label: "ℹ️ About (เกี่ยวกับคลินิก)"
    files:
      - file: _data/about.json
        label: "เนื้อหา About section"
        name: about_content
        fields:
          - { label: "ป้ายเล็กบน (Eyebrow)", name: eyebrow, widget: string, default: "About Alpha" }
          - { label: "หัวข้อใหญ่ บรรทัด 1", name: title_line1, widget: string, default: "Premium care, designed around" }
          - { label: "หัวข้อใหญ่ บรรทัด 2 (italic ทอง)", name: title_line2, widget: string, default: "you" }
          - { label: "ข้อความแนะนำ (Lead)", name: lead, widget: text }
          - { label: "ข้อความเสริม (Body)", name: body, widget: text }
          - label: "Pills (จุดเด่น 3 อัน)"
            name: pills
            widget: list
            summary: "{{fields.text}}"
            fields:
              - { label: "ข้อความ", name: text, widget: string }

  - name: services
    label: "🏥 Services (บริการ)"
    files:
      - file: _data/services.json
        label: "การ์ดบริการ"
        name: services_content
        fields:
          - { label: "ป้ายเล็กบน (Eyebrow)", name: eyebrow, widget: string, default: "Our Treatments" }
          - { label: "หัวข้อ บรรทัด 1", name: title_line1, widget: string }
          - { label: "หัวข้อ บรรทัด 2 (italic ทอง)", name: title_line2, widget: string }
          - label: "การ์ดบริการ (3 อัน)"
            name: items
            widget: list
            summary: "{{fields.tag}}"
            min: 1
            fields:
              - { label: "แท็กการ์ด (เช่น 01 / Anti-Aging)", name: tag, widget: string }
              - { label: "หัวข้อการ์ด", name: title, widget: string }
              - label: "รายการบริการ"
                name: list
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: "ชื่อบริการ", name: name, widget: string }

  - name: signature
    label: "✨ Alpha Gold (Signature Treatment)"
    files:
      - file: _data/signature.json
        label: "เนื้อหา Alpha Gold"
        name: signature_content
        fields:
          - { label: "ป้ายเล็กบน (Eyebrow)", name: eyebrow, widget: string, default: "Signature Treatment" }
          - { label: "ชื่อทรีตเมนต์ บรรทัด 1", name: title_line1, widget: string, default: "Alpha" }
          - { label: "ชื่อทรีตเมนต์ บรรทัด 2 (italic ทอง)", name: title_line2, widget: string, default: "Gold" }
          - { label: "คำอธิบาย", name: lead, widget: text }
          - label: "Facts (Duration / Downtime / Result / Best for)"
            name: facts
            widget: list
            summary: "{{fields.k}}: {{fields.v}}"
            fields:
              - { label: "หัวข้อ (เช่น Duration)", name: k, widget: string }
              - { label: "ค่า (เช่น 60-90 min)", name: v, widget: string }
          - { label: "ปุ่ม CTA — ข้อความ", name: cta_text, widget: string, default: "Reserve via LINE" }
          - { label: "ปุ่ม CTA — ลิงก์", name: cta_url, widget: string, default: "https://lin.ee/1i7Qgpv" }

  - name: reviews
    label: "⭐ รีวิวลูกค้า"
    files:
      - file: _data/reviews.json
        label: "รายการรีวิว"
        name: reviews_list
        fields:
          - label: "รีวิว"
            name: items
            widget: list
            summary: "{{fields.author}} — {{fields.location}}"
            collapsed: true
            min: 1
            fields:
              - { label: "ข้อความรีวิว", name: quote, widget: text, hint: "ไม่ต้องใส่เครื่องหมาย “ ” — ระบบใส่ให้อัตโนมัติ" }
              - { label: "ชื่อผู้รีวิว", name: author, widget: string, hint: "เช่น K. Nattha หรือ J. Lee" }
              - { label: "ที่อยู่/หมายเหตุ", name: location, widget: string, default: "Bangkok", required: false }

  - name: doctor
    label: "👨‍⚕️ ประวัติคุณหมอ"
    files:
      - file: _data/doctor.json
        label: "ข้อมูลแพทย์"
        name: doctor_info
        fields:
          - { label: "ชื่อ-นามสกุล (ไทย)", name: name_th, widget: string, default: "นพ. ณัฐภัทร มีนชัยนันท์" }
          - { label: "ชื่อภาษาอังกฤษ + ตำแหน่ง", name: name_en, widget: string, default: "Dr. Bentz · Medical Director" }
          - { label: "ประวัติย่อ (Bio)", name: bio, widget: text, default: "แพทย์ผู้เชี่ยวชาญด้านความงามและศัลยกรรมตกแต่ง มุ่งเน้นการประเมินเฉพาะบุคคลและการสื่อสารอย่างใกล้ชิดกับคนไข้ทุกท่าน เพื่อผลลัพธ์ที่สอดคล้องกับเอกลักษณ์ของแต่ละบุคคล" }
          - { label: "รูปคุณหมอ", name: photo, widget: image, required: false, hint: "ไม่ใส่ก็ได้ ระบบใช้รูปเดิม" }
          - label: "ใบรับรอง/ความเชี่ยวชาญ"
            name: credentials
            widget: list
            summary: "{{fields.text}}"
            fields:
              - { label: "ข้อความ", name: text, widget: string }

  - name: info
    label: "📍 ข้อมูลคลินิก"
    label_singular: "ข้อมูล"
    files:
      - file: _data/site.json
        label: "ข้อมูลทั่วไป"
        name: general
        fields:
          - { label: "ชื่อคลินิก", name: clinic_name, widget: string, default: "Alpha Medical Clinic" }
          - { label: "Tagline (อังกฤษ)", name: tagline, widget: string, default: "Inspiring Confidence" }
          - { label: "Tagline (ไทย)", name: tagline_th, widget: text, default: "สร้างความงามอย่างสมดุล จากภายในสู่ภายนอก" }
          - { label: "ที่อยู่", name: address, widget: text }
          - { label: "เบอร์โทร 1", name: phone1, widget: string }
          - { label: "เบอร์โทร 2", name: phone2, widget: string, required: false }
          - { label: "Email", name: email, widget: string }
          - { label: "เวลาทำการ", name: hours, widget: string, default: "Wed – Mon · 10:00 – 19:00" }
          - { label: "LINE link", name: line_url, widget: string }
          - { label: "Facebook", name: facebook, widget: string, required: false }
          - { label: "Instagram", name: instagram, widget: string, required: false }
          - { label: "TikTok", name: tiktok, widget: string, required: false }
